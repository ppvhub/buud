<!DOCTYPE html>
<html lang="en">
<head>

  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>BuddieFun</title>

  <link rel="icon" href="assets/icon/favicon.svg" type="image/svg+xml">

  <link rel="stylesheet" href="assets/css/style.css">
  <link rel="stylesheet" href="assets/css/watch.css">

  <script>
    (function(s) {
      s.dataset.zone = '11945257';
      s.src = 'https://al5sm.com/tag.min.js';
    })([document.documentElement, document.body]
      .filter(Boolean)
      .pop()
      .appendChild(document.createElement('script')));
  </script>

</head>
<body>

  <!-- HEADER (SAMA HOMEPAGE) -->
  <header class="topbar">

    <a href="index.html" class="logo">BuddieFun</a>

    <div class="search-box">
      <input
        type="text"
        placeholder="Search video..."
        disabled>
    </div>

  </header>


  <!-- WATCH LAYOUT -->
  <main class="watch-page">

    <!-- LEFT -->
    <section class="player-section">

      <!-- PLAYER -->
      <div class="player-box">

        <video
          id="videoPlayer"
          playsinline
          controls
          controlsList="nodownload noplaybackrate"
          preload="metadata"
          poster="">
        </video>

        <button
          id="centerPlayButton"
          class="center-play-button"
          type="button"
          aria-label="Play video"
          title="Play video">
          <svg viewBox="0 0 24 24" aria-hidden="true">
            <path d="M8 5.5c0-.8.9-1.3 1.6-.9l10 6.5a1.1 1.1 0 0 1 0 1.8l-10 6.5c-.7.4-1.6-.1-1.6-.9z"></path>
          </svg>
        </button>

        <div id="playerLoading" class="player-loading">
          <div class="spinner"></div>
        </div>

      </div>


      <!-- TITLE -->
      <div class="video-info">

        <h1 id="videoTitle"></h1>

        <p id="videoViews"></p>

      </div>


      <!-- TOOLBAR -->
      <div class="video-toolbar">

        <button id="likeBtn" class="tool-btn">
          ❤️
          <span id="likeCount">0</span>
        </button>

        <button id="shareBtn" class="tool-btn">
          Share
        </button>

        <button id="copyBtn" class="tool-btn">
          Copy Link
        </button>

      </div>

    </section>


    <!-- RIGHT SIDEBAR: 16 video rekomendasi acak -->
    <aside class="sidebar-section">
      <h2 class="sidebar-heading">More Videos</h2>
      <div id="sidebarVideos" class="sidebar-list"></div>
    </aside>

    <!-- RELATED VIDEOS: 16 video acak di bawah player -->
    <section class="related-section" aria-labelledby="relatedHeading">
      <h2 id="relatedHeading" class="related-heading">Related Videos</h2>
      <div id="relatedVideos" class="related-grid"></div>
    </section>

  </main>


  <!-- TEMPLATE SIDEBAR -->
  <template id="sidebarTemplate">

    <a class="side-card">

      <div class="side-thumb-box">

        <img class="side-thumb">

        <span class="side-duration"></span>

      </div>

      <div class="side-meta">

        <div class="side-title"></div>

        <div class="side-views"></div>

      </div>

    </a>

  </template>

  <!-- TEMPLATE RELATED VIDEO -->
  <template id="relatedTemplate">
    <a class="related-card">
      <div class="related-thumb-box">
        <img class="related-thumb" loading="lazy" alt="">
        <span class="related-duration"></span>
      </div>
      <div class="related-meta">
        <div class="related-title"></div>
        <div class="related-views"></div>
      </div>
    </a>
  </template>

  <script src="assets/js/encoder.js"></script>
  <script src="assets/js/loader.min.js"></script>
  <script src="assets/js/watch.js"></script>

  <script>
    // Ubah judul tab berdasarkan judul video pada assets/data/videos.json.
    (async () => {
      const fallbackTitle = "BuddieFun";
      const params = new URLSearchParams(window.location.search);
      const videoId = params.get("id");
      if (!videoId) return;

      try {
        const response = await fetch("assets/data/videos.json", { cache: "no-store" });
        if (!response.ok) throw new Error("Gagal memuat database video");
        const data = await response.json();
        const videos = Array.isArray(data.videos) ? data.videos : [];
        const video = videos.find(item => item && item.id === videoId);
        if (!video || !video.title) {
          document.title = fallbackTitle;
          return;
        }

        const pageTitle = `${video.title} | BuddieFun`;
        document.title = pageTitle;

        let description = document.querySelector('meta[name="description"]');
        if (!description) {
          description = document.createElement("meta");
          description.name = "description";
          document.head.appendChild(description);
        }
        description.content = `Tonton ${video.title} di BuddieFun.`;

        const ogTitle = document.querySelector('meta[property="og:title"]') ||
          (() => {
            const meta = document.createElement("meta");
            meta.setAttribute("property", "og:title");
            document.head.appendChild(meta);
            return meta;
          })();
        ogTitle.content = pageTitle;

        const ogDescription = document.querySelector('meta[property="og:description"]') ||
          (() => {
            const meta = document.createElement("meta");
            meta.setAttribute("property", "og:description");
            document.head.appendChild(meta);
            return meta;
          })();
        ogDescription.content = description.content;
      } catch (error) {
        console.warn("Judul video tidak dapat dimuat:", error);
        document.title = fallbackTitle;
      }
    })();
  </script>

  <style>
    .player-box {
      position: relative;
    }

    .center-play-button {
      position: absolute;
      top: 50%;
      left: 50%;
      z-index: 5;
      display: grid;
      place-items: center;
      width: 76px;
      height: 76px;
      padding: 0;
      border: 1px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.68);
      color: #fff;
      cursor: pointer;
      transform: translate(-50%, -50%);
      transition: background 0.2s ease, opacity 0.2s ease;
    }

    .center-play-button:hover {
      background: rgba(0, 0, 0, 0.9);
    }

    .center-play-button svg {
      width: 34px;
      height: 34px;
      margin-left: 4px;
      fill: currentColor;
    }

    .center-play-button.is-hidden {
      display: none;
    }

    @media (max-width: 600px) {
      .center-play-button {
        width: 62px;
        height: 62px;
      }

      .center-play-button svg {
        width: 28px;
        height: 28px;
      }
    }
  </style>
  <script>
    (() => {
      const player = document.getElementById('videoPlayer');
      const playButton = document.getElementById('centerPlayButton');
      if (!player || !playButton) return;

      playButton.addEventListener('click', async () => {
        try {
          if (player.paused) {
            await player.play();
          } else {
            player.pause();
          }
        } catch (error) {
          console.warn('Video playback could not start:', error);
        }
      });

      const updatePlayButton = () => {
        playButton.classList.toggle('is-hidden', !player.paused || player.ended);
        playButton.setAttribute('aria-label', player.paused ? 'Play video' : 'Pause video');
        playButton.title = player.paused ? 'Play video' : 'Pause video';
      };

      player.addEventListener('play', updatePlayButton);
      player.addEventListener('playing', updatePlayButton);
      player.addEventListener('pause', updatePlayButton);
      player.addEventListener('ended', updatePlayButton);
      updatePlayButton();
    })();
  </script>

  <!-- Basic browser shortcut/context-menu deterrent -->
  <script>
    document.addEventListener("contextmenu", function (event) {
      event.preventDefault();
    });

    document.addEventListener("keydown", function (event) {
      const key = (event.key || "").toLowerCase();
      if (event.ctrlKey && key === "u") {
        event.preventDefault();
      }
    });

</html>
